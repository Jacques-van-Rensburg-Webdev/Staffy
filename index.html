<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staffy</title>
  <meta name="theme-color" content="#EDF0F3">
  <link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">

    <!-- Zone: Header (56pt phone / 72pt desktop). Title + status left, month picker right. -->
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-header-text">
          <h1 class="app-title">Staffy</h1>
          <p class="app-subtitle hint">Monthly duty roster with fair sharing of good and bad shifts</p>
        </div>
        <p class="app-status text-xs text-muted" id="status" aria-live="polite">Loading…</p>
        <label class="visually-hidden" for="month">Month</label>
        <input class="input input-month" type="month" id="month">
      </div>
    </header>

    <!-- Zone: Content (scrolls). Filled by js/app.js with the active screen. -->
    <main class="app-content" id="main"></main>

    <!-- Zone: Tab bar (56pt + safe area). On desktop it becomes a tab strip under the Header. -->
    <nav class="app-tabbar" aria-label="Main">
      <div class="app-tabbar-inner">
        <a class="tab" href="#/plan" data-tab="plan">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10M15 10v10"/></svg>
          Rota
        </a>
        <a class="tab" href="#/staff" data-tab="staff">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5c3 0 5.5 2 5.5 5"/></svg>
          Staff
        </a>
        <a class="tab" href="#/shifts" data-tab="shifts">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Shifts
        </a>
        <a class="tab" href="#/leave" data-tab="leave">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>
          Leave
        </a>
      </div>
    </nav>

  </div>

  <!-- Shift picker that opens over a rota cell (js/popover.js) -->
  <div class="popover" id="pop" hidden></div>
</body>
</html>
